[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'false'

[host_machine]
system = 'robu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]

c_args = ['--target=x86_64-linux-gnu', '-ffreestanding', '-fPIC', '-fno-stack-protector', '-mno-red-zone', '-D_GNU_SOURCE']
cpp_args = ['--target=x86_64-linux-gnu', '-ffreestanding', '-fPIC', '-fno-stack-protector', '-mno-red-zone', '-D_GNU_SOURCE', '-stdlib=libc++', '-D_LIBCPP_DISABLE_AVAILABILITY', '-D__cpp_concepts=202002L']
c_link_args = ['--target=x86_64-linux-gnu', '-fuse-ld=lld']
cpp_link_args = ['--target=x86_64-linux-gnu', '-fuse-ld=lld', '-stdlib=libc++']

[binaries]
c = '/opt/homebrew/opt/llvm/bin/clang'
cpp = '/opt/homebrew/opt/llvm/bin/clang++'
ar = '/opt/homebrew/opt/llvm/bin/llvm-ar'
strip = '/opt/homebrew/opt/llvm/bin/llvm-strip'
pkg-config = 'false'

[host_machine]
system = 'robu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
c_args = ['--target=x86_64-linux-gnu', '-ffreestanding', '-fPIC', '-fno-stack-protector', '-mno-red-zone', '-D_GNU_SOURCE']
cpp_args = ['--target=x86_64-linux-gnu', '-ffreestanding', '-fPIC', '-fno-stack-protector', '-mno-red-zone', '-D_GNU_SOURCE']
c_link_args = ['--target=x86_64-linux-gnu', '-fuse-ld=/opt/homebrew/bin/ld.lld']
cpp_link_args = ['--target=x86_64-linux-gnu', '-fuse-ld=/opt/homebrew/bin/ld.lld']

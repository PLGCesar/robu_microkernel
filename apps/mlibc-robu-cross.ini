[binaries]
c = '/opt/homebrew/opt/llvm/bin/clang'
cpp = '/opt/homebrew/opt/llvm/bin/clang++'
ar = '/opt/homebrew/opt/llvm/bin/llvm-ar'
strip = '/opt/homebrew/opt/llvm/bin/llvm-strip'
pkg-config = 'false'

[host_machine]
system = 'robu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
# SSE is enabled here: the kernel now saves/restores per-thread FPU/SSE
# state across every context switch (arch/x86_64/src/fpu.c, tcb_t::fpu_state,
# hooked into trap_dispatch()/arch_enter_thread()), so ring-3 code is free
# to use it -- needed for mlibc's own printf %f/%g, strtod, and math.h.
c_args = ['--target=x86_64-linux-gnu', '-ffreestanding', '-fPIC', '-fno-stack-protector', '-mno-red-zone', '-D_GNU_SOURCE']
cpp_args = ['--target=x86_64-linux-gnu', '-ffreestanding', '-fPIC', '-fno-stack-protector', '-mno-red-zone', '-D_GNU_SOURCE']
c_link_args = ['--target=x86_64-linux-gnu', '-fuse-ld=ld.lld']
cpp_link_args = ['--target=x86_64-linux-gnu', '-fuse-ld=ld.lld']
